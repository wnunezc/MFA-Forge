[workspace]
members = [
    "crates/core",
    "crates/application",
    "crates/platform-windows",
    "crates/storage",
    "crates/cli",
    "crates/gui",
]
resolver = "2"

[workspace.package]
version = "0.1.20"
edition = "2024"
license = "MIT"

[workspace.dependencies]
aes-gcm = { version = "0.10", features = ["std"] }
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
directories = "6"
eframe = { version = "0.29", features = ["default_fonts"] }
egui = "0.29"
raw-window-handle = "0.6"
rpassword = "7"
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
totp-rs = { version = "5.7", default-features = false, features = ["otpauth", "zeroize"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

[profile.dev]
incremental = false

[profile.test]
incremental = false

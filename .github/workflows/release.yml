name: Release MSI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to build without publishing
        required: true
        default: "1.0.2"
  push:
    tags:
      - "v*-rc.*"
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-msi:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      asset_name: ${{ steps.release_meta.outputs.asset_name }}
      make_latest: ${{ steps.release_meta.outputs.make_latest }}
      notes_path: ${{ steps.release_meta.outputs.notes_path }}
      prerelease: ${{ steps.release_meta.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install WiX Toolset
        shell: powershell
        run: choco install wixtoolset -y --no-progress

      - name: Install cargo-wix
        shell: powershell
        run: cargo install cargo-wix --version 0.3.9 --locked

      - name: Resolve release metadata
        id: release_meta
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
            if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Unsupported build version: $version. Expected MAJOR.MINOR.PATCH"
            }

            $assetName = "MFA-Forge-$version-x64.msi"
            $notesPath = "docs/release/$version-release.md"
            $prerelease = "false"
            $makeLatest = "false"
          } elseif ("${{ github.ref_name }}" -match '^v(?<version>\d+\.\d+\.(?<patch>\d+))-rc\.(?<rc>\d+)$') {
            if ($Matches.patch -ne $Matches.rc) {
              throw "RC number must match patch number for MFA-Forge: ${{ github.ref_name }}"
            }

            $version = $Matches.version
            $rcNumber = $Matches.rc
            $assetName = "MFA-Forge-RC$rcNumber-x64.msi"
            $notesPath = "docs/release/$version-rc.$rcNumber-draft.md"
            $prerelease = "true"
            $makeLatest = "false"
          } elseif ("${{ github.ref_name }}" -match '^v(?<version>\d+\.\d+\.\d+)$') {
            $version = $Matches.version
            $assetName = "MFA-Forge-$version-x64.msi"
            $notesPath = "docs/release/$version-release.md"
            $prerelease = "false"
            $makeLatest = "true"
          } else {
            throw "Unsupported tag format: ${{ github.ref_name }}. Expected v0.1.N-rc.N or vMAJOR.MINOR.PATCH"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "asset_name=$assetName" >> $env:GITHUB_OUTPUT
          "notes_path=$notesPath" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          "make_latest=$makeLatest" >> $env:GITHUB_OUTPUT

      - name: Validate Cargo version
        shell: powershell
        run: |
          $workspaceVersion = (Select-String -Path 'Cargo.toml' -Pattern 'version = \"([^\"]+)\"').Matches[0].Groups[1].Value
          if ($workspaceVersion -ne '${{ steps.release_meta.outputs.version }}') {
            throw "Cargo workspace version $workspaceVersion does not match tag version ${{ steps.release_meta.outputs.version }}"
          }

      - name: Validate formatting
        shell: powershell
        run: cargo fmt --all -- --check

      - name: Validate clippy
        shell: powershell
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Validate tests
        shell: powershell
        run: cargo test --workspace

      - name: Build release binaries
        shell: powershell
        run: cargo build --workspace --release

      - name: Build MSI
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path 'target/rc' | Out-Null
          cargo wix --package mfa-forge-gui --no-build --nocapture --target-bin-dir target/release --output "target/rc/${{ steps.release_meta.outputs.asset_name }}"

      - name: Generate checksum
        shell: powershell
        run: |
          $msiPath = Join-Path $PWD "target/rc/${{ steps.release_meta.outputs.asset_name }}"
          if (-not (Test-Path -LiteralPath $msiPath)) {
            throw "MSI not found: $msiPath"
          }

          $hash = (Get-FileHash -LiteralPath $msiPath -Algorithm SHA256).Hash
          Set-Content -LiteralPath ($msiPath + '.sha256.txt') -Value ($hash + ' *' + [System.IO.Path]::GetFileName($msiPath))

      - name: Upload MSI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mfa-forge-msi
          path: |
            target/rc/*.msi
            target/rc/*.sha256.txt

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows-msi
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download MSI artifacts
        uses: actions/download-artifact@v4
        with:
          name: mfa-forge-msi
          path: target/rc

      - name: Prepare release notes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'target' | Out-Null
          $notesPath = "${{ needs.windows-msi.outputs.notes_path }}"

          if (Test-Path -LiteralPath $notesPath) {
            Copy-Item -LiteralPath $notesPath -Destination 'target/release-notes.md' -Force
          } else {
            Set-Content -LiteralPath 'target/release-notes.md' -Value "MFA-Forge ${{ github.ref_name }}"
          }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: MFA-Forge ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: target/release-notes.md
          prerelease: ${{ needs.windows-msi.outputs.prerelease }}
          make_latest: ${{ needs.windows-msi.outputs.make_latest }}
          files: |
            target/rc/*.msi
            target/rc/*.sha256.txt
